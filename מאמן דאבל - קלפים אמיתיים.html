<title>מאמן דאבל</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Secular+One&display=swap">
<style>
/* Layout: a felt game table — two round cards face each other, stats strip above, symbol glossary below */
:root{
  --felt:#0f4c52; --felt-deep:#08302f; --card:#fdfbf5; --card-rim:#ece5d3;
  --ink:#f4efe2; --muted:#a6c6c2; --accent:#ffcf3f; --good:#3ddc84; --bad:#ff5a5f;
  --chip:rgba(255,255,255,.08); --chip-line:rgba(255,255,255,.16);
  --display:"Secular One","Rubik",system-ui,sans-serif;
  --body:"Rubik",system-ui,"Segoe UI",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--felt-deep) radial-gradient(ellipse at 50% 25%,var(--felt),var(--felt-deep) 75%) fixed;color:var(--ink);font-family:var(--body);font-size:15px}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:18px 48px;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,5vw,44px);line-height:1;margin:0;letter-spacing:.5px}
h1 span{color:var(--accent)}
.sub{color:var(--muted);margin:6px 0 0;font-size:14px}
.tabs{display:flex;gap:6px;background:var(--chip);border:1px solid var(--chip-line);padding:4px;border-radius:999px}
.tabs button{font:inherit;font-weight:500;color:var(--ink);background:none;border:0;padding:8px 16px;border-radius:999px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent);color:#2a2100}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{background:var(--chip);border:1px solid var(--chip-line);border-radius:14px;padding:10px 14px}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:clamp(20px,3.4vw,28px);font-variant-numeric:tabular-nums;line-height:1.1}
.stat small{color:var(--muted);font-size:12px;letter-spacing:.3px}
.stat.warn b{color:var(--bad)}
.status{text-align:center;min-height:1.6em;font-size:17px;color:var(--muted)}
.status strong{color:var(--good);font-weight:700}
.status.err strong{color:var(--bad)}
.arena{position:relative;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:clamp(14px,4vw,48px);padding-block:6px}
.card{--d:min(42vw,420px,64vh);width:var(--d);height:var(--d);max-width:100%;border-radius:50%;background:var(--card);position:relative;box-shadow:0 14px 30px rgba(0,0,0,.4),inset 0 0 0 7px var(--card-rim);transition:box-shadow .15s}
.card.wrong{box-shadow:0 14px 30px rgba(0,0,0,.4),inset 0 0 0 7px var(--bad)}
.sym{position:absolute;border:0;padding:0;margin:0;background:none;cursor:pointer;border-radius:50%;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.sym svg,.sym img{width:100%;height:100%;display:block;overflow:visible;pointer-events:none;object-fit:contain}
.sym:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sym.hit::after{content:"";position:absolute;inset:-10%;border-radius:50%;border:5px solid var(--good);animation:ring .45s ease-out}
.sym.hit svg{animation:pop .45s ease-out}
.sym.miss svg{animation:shake .32s}
@keyframes pop{40%{transform:scale(1.25)}}
.sym img{-webkit-user-drag:none;user-select:none}
@keyframes ring{from{transform:scale(.6);opacity:0}}
@keyframes shake{25%{transform:translateX(-8%)}75%{transform:translateX(8%)}}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(4,26,27,.78);border-radius:28px;z-index:5;text-align:center;padding:16px}
.overlay h2{font-family:var(--display);font-weight:400;font-size:clamp(26px,5vw,40px);margin:0 0 6px}
.overlay p{color:var(--muted);margin:0 0 16px}
.big{font:inherit;font-family:var(--display);font-size:22px;background:var(--accent);color:#2a2100;border:0;border-radius:999px;padding:12px 32px;cursor:pointer;box-shadow:0 6px 0 #b8901c}
.big:active{transform:translateY(3px);box-shadow:0 3px 0 #b8901c}
.big:focus-visible,.tabs button:focus-visible,.opt:focus-within{outline:3px solid var(--ink);outline-offset:2px}
.opts{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.opt{display:flex;align-items:center;gap:8px;background:var(--chip);border:1px solid var(--chip-line);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:14px}
.opt input{accent-color:var(--accent);width:16px;height:16px;margin:0}
.skip{font:inherit;color:var(--ink);background:none;border:1px solid var(--chip-line);border-radius:999px;padding:7px 14px;cursor:pointer}
details{background:var(--chip);border:1px solid var(--chip-line);border-radius:18px;padding:12px 16px}
summary{cursor:pointer;font-family:var(--display);font-size:20px}
summary small{font-family:var(--body);color:var(--muted);font-size:13px;margin-inline-start:8px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:10px;margin-top:14px}
.g{background:var(--card);color:#2b2b36;border-radius:14px;padding:8px 6px 6px;text-align:center;font-size:13px;font-weight:500}
.g svg,.g img{width:100%;aspect-ratio:1;display:block;object-fit:contain}
@media (max-width:640px){
  .card{--d:min(88vw,41vh)}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .arena{gap:12px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap" dir="rtl">
  <header>
    <div>
      <h1>מאמן <span>דאבל</span></h1>
      <p class="sub">בכל שני קלפים יש בדיוק סמל אחד משותף. מצאו אותו ולחצו עליו, באחד הקלפים.</p>
    </div>
    <div class="tabs" role="group" aria-label="מצב משחק">
      <button id="mFree" aria-pressed="true">אימון חופשי</button>
      <button id="mRace" aria-pressed="false">מרוץ 60 שניות</button>
    </div>
  </header>

  <div class="stats">
    <div class="stat"><b id="s1">0</b><small id="l1">נמצאו</small></div>
    <div class="stat"><b id="s2">0</b><small id="l2">טעויות</small></div>
    <div class="stat" id="st3"><b id="s3">–</b><small id="l3">זמן ממוצע</small></div>
    <div class="stat"><b id="s4">–</b><small id="l4">הכי מהיר</small></div>
  </div>

  <div class="status" id="status" aria-live="polite">חפשו את הסמל המשותף</div>

  <div class="arena" id="arena">
    <div class="card" id="cardA" aria-label="קלף ימני"></div>
    <div class="card" id="cardB" aria-label="קלף שמאלי"></div>
    <div class="overlay" id="overlay" hidden>
      <div>
        <h2 id="ovTitle">מרוץ 60 שניות</h2>
        <p id="ovText">כמה זוגות תמצאו בדקה? כל טעות מורידה 2 שניות.</p>
        <button class="big" id="ovBtn">התחלה</button>
      </div>
    </div>
  </div>

  <div class="opts">
    <label class="opt"><input type="checkbox" id="oRot" checked> סיבוב סמלים</label>
    <label class="opt"><input type="checkbox" id="oSize" checked> גדלים שונים</label>
    <label class="opt"><input type="checkbox" id="oName" checked> הצג שם אחרי מציאה</label>
    <label class="opt"><input type="checkbox" id="oSound" checked> צלילים</label>
    <button class="skip" id="skip">דלג על הזוג</button>
  </div>

  <details id="gal">
    <summary>57 הסמלים <small>כדאי להכיר את השמות, במשחק אומרים אותם בקול</small></summary>
    <div class="gallery" id="gallery"></div>
  </details>
</div>

const svgOf=i=>`<img src="${IMG[i]}" alt="" draggable="false">`;

// Projective plane of order 7: 57 cards × 8 symbols, every two cards share exactly one symbol
const N=7, DECK=(()=>{const c=[[...Array(N+1).keys()]];
  for(let j=0;j<N;j++){const k=[0];for(let t=0;t<N;t++)k.push(N+1+N*j+t);c.push(k)}
  for(let i=0;i<N;i++)for(let j=0;j<N;j++){const k=[i+1];for(let t=0;t<N;t++)k.push(N+1+N*t+((i*t+j)%N));c.push(k)}
  return c})();

const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem('dobble.'+k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem('dobble.'+k,JSON.stringify(v))}catch{}}};
const opts={rot:store.get('rot',true),size:store.get('size',true),name:store.get('name',true),sound:store.get('sound',true)};
[['oRot','rot'],['oSize','size'],['oName','name'],['oSound','sound']].forEach(([id,k])=>{const el=$(id);el.checked=opts[k];el.onchange=()=>{opts[k]=el.checked;store.set(k,el.checked);if(k==='rot'||k==='size')deal(true)}});

let mode='free', score=0, miss=0, times=[], common=-1, pairStart=0, locked=false, lastPair='', raceEnd=0, raceOn=false, raf=0;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=ms=>(ms/1000).toFixed(2);

let actx=null;
function beep(ok){if(!opts.sound)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime;
  o.type=ok?'triangle':'square';o.frequency.setValueAtTime(ok?660:180,t);if(ok)o.frequency.exponentialRampToValueAtTime(990,t+.12);
  g.gain.setValueAtTime(ok?.18:.08,t);g.gain.exponentialRampToValueAtTime(.001,t+(ok?.22:.18));o.connect(g).connect(actx.destination);o.start(t);o.stop(t+.25)}catch{}}

function layCard(el,syms){
  el.innerHTML='';el.classList.remove('wrong');
  const order=shuffle([...syms]), off=Math.random()*Math.PI*2;
  order.forEach((s,i)=>{
    let x=50,y=50,size=34;
    if(i>0){const a=off+(i-1)*2*Math.PI/7, r=30+(opts.size?Math.random()*3:0);x=50+r*Math.cos(a);y=50+r*Math.sin(a);size=25}
    if(opts.size)size*=0.72+Math.random()*0.42;
    const deg=opts.rot?Math.random()*360:0;
    const b=document.createElement('button');b.className='sym';b.dataset.s=s;b.setAttribute('aria-label',SYM[s][0]);
    b.style.cssText=`left:${x}%;top:${y}%;width:${size}%;height:${size}%;transform:translate(-50%,-50%) rotate(${deg}deg)`;
    b.innerHTML=svgOf(s);el.appendChild(b)});
}
function deal(keepStatus){
  let a,b,key;do{a=Math.random()*57|0;b=Math.random()*57|0;key=[a,b].sort().join()}while(a===b||key===lastPair);
  lastPair=key;common=DECK[a].find(s=>DECK[b].includes(s));
  layCard($('cardA'),DECK[a]);layCard($('cardB'),DECK[b]);
  pairStart=performance.now();locked=false;
  if(!keepStatus)setStatus('חפשו את הסמל המשותף');
}
function setStatus(html,err){const s=$('status');s.innerHTML=html;s.classList.toggle('err',!!err)}

function onPick(e){
  const b=e.target.closest('.sym');if(!b||locked)return;
  if(mode==='race'&&!raceOn)return;
  e.preventDefault();
  const s=+b.dataset.s;
  if(s===common){
    locked=true;const t=performance.now()-pairStart;times.push(t);score++;beep(true);
    document.querySelectorAll(`.sym[data-s="${s}"]`).forEach(x=>x.classList.add('hit'));
    if(mode==='free'){const best=store.get('fastest',null);if(best==null||t<best)store.set('fastest',t)}
    setStatus(opts.name?`<strong>${SYM[s][0]}</strong> · ${fmt(t)} שניות`:`<strong>נכון!</strong> · ${fmt(t)} שניות`);
    render();setTimeout(()=>deal(true),420);
  }else{
    miss++;beep(false);b.classList.remove('miss');void b.offsetWidth;b.classList.add('miss');
    const card=b.closest('.card');card.classList.add('wrong');setTimeout(()=>card.classList.remove('wrong'),300);
    if(mode==='race')raceEnd-=2000;
    setStatus(`<strong>${SYM[s][0]}</strong> לא מופיע בקלף השני`,true);render();
  }
}
$('cardA').addEventListener('pointerdown',onPick);$('cardB').addEventListener('pointerdown',onPick);
['cardA','cardB'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')onPick(e)}));

function render(){
  $('s1').textContent=score;$('s2').textContent=miss;
  if(mode==='free'){
    $('l3').textContent='זמן ממוצע';$('s3').textContent=times.length?fmt(times.reduce((a,b)=>a+b,0)/times.length):'–';
    $('l4').textContent='הכי מהיר אי פעם';const f=store.get('fastest',null);$('s4').textContent=f==null?'–':fmt(f);
    $('st3').classList.remove('warn');
  }else{
    $('l3').textContent='זמן נותר';$('l4').textContent='שיא במרוץ';$('s4').textContent=store.get('best',0)||'–';
    const left=raceOn?Math.max(0,raceEnd-performance.now()):60000;$('s3').textContent=(left/1000).toFixed(1);
    $('st3').classList.toggle('warn',raceOn&&left<10000);
  }
}
function tick(){if(!raceOn)return;const left=raceEnd-performance.now();if(left<=0){finishRace();return}render();raf=requestAnimationFrame(tick)}
function startRace(){score=0;miss=0;times=[];raceOn=true;raceEnd=performance.now()+60000;$('overlay').hidden=true;deal();render();raf=requestAnimationFrame(tick)}
function finishRace(){
  raceOn=false;cancelAnimationFrame(raf);locked=true;
  const best=store.get('best',0),isBest=score>best;if(isBest)store.set('best',score);
  const avg=times.length?fmt(times.reduce((a,b)=>a+b,0)/times.length):'–';
  $('ovTitle').textContent=isBest&&score>0?`שיא חדש! ${score} זוגות`:`${score} זוגות`;
  $('ovText').textContent=`ממוצע ${avg} שניות לזוג · ${miss} טעויות${!isBest&&best?` · השיא שלך ${best}`:''}`;
  $('ovBtn').textContent='עוד סיבוב';$('overlay').hidden=false;render();
}
function setMode(m){
  mode=m;raceOn=false;cancelAnimationFrame(raf);score=0;miss=0;times=[];
  $('mFree').setAttribute('aria-pressed',m==='free');$('mRace').setAttribute('aria-pressed',m==='race');
  $('skip').hidden=m==='race';
  if(m==='race'){$('ovTitle').textContent='מרוץ 60 שניות';$('ovText').textContent='כמה זוגות תמצאו בדקה? כל טעות מורידה 2 שניות.';$('ovBtn').textContent='התחלה';$('overlay').hidden=false}
  else $('overlay').hidden=true;
  deal();render();
}
$('mFree').onclick=()=>setMode('free');$('mRace').onclick=()=>setMode('race');
$('ovBtn').onclick=startRace;
$('skip').onclick=()=>{const s=common;setStatus(`הסמל המשותף היה <strong>${SYM[s][0]}</strong>`);document.querySelectorAll(`.sym[data-s="${s}"]`).forEach(x=>x.classList.add('hit'));locked=true;setTimeout(()=>deal(true),900)};

$('gallery').innerHTML=SYM.map((s,i)=>`<div class="g">${svgOf(i)}${s[0]}</div>`).join('');
setMode('free');
</script>
